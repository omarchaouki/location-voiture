# nginx pour Flotta — à déposer en /etc/nginx/sites-available/flotta
#
#   sudo ln -sf /etc/nginx/sites-available/flotta /etc/nginx/sites-enabled/flotta
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TANT QU'IL N'Y A PAS DE DOMAINE, ce fichier sert l'application en clair sur l'IP.
# C'est utilisable pour valider un déploiement, PAS pour recevoir de vrais clients :
# le mot de passe et le cookie de session passent en clair. Voir la section « Le jour
# où le domaine arrive » dans docs/DEPLOY.md.

# Le SSR renvoie beaucoup de HTML et de JSON : la compression divise le transfert par
# quatre, et c'est ce qui se voit le plus depuis une connexion mobile marocaine.
gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Une photo d'état des lieux prise au téléphone pèse plusieurs mégaoctets. La valeur
    # par défaut de nginx est 1 Mo, et le refus arrive en 413 sans explication.
    client_max_body_size 25m;

    # `$host` et non une valeur figée : c'est ce que l'application relit pour fabriquer
    # les liens d'invitation. Une valeur fausse ici envoie les clients sur localhost.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Le SSR peut prendre quelques secondes au premier rendu, tuiles de carte comprises.
    proxy_read_timeout 60s;

    # Les fichiers versionnés par le build portent une empreinte dans leur nom : ils sont
    # immuables, et les redemander à chaque page est un aller-retour perdu. Le HTML, lui,
    # n'est JAMAIS mis en cache — il porte la session.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
