<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>RTL probe</title>
    
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
      #map { width: 100%; height: 320px; border: 1px solid #333; }
      pre { white-space: pre-wrap; font-size: 12px; border: 1px solid #999; padding: 8px; }
      .big { font-size: 28px; }
    </style>
  </head>
  <body>
    <h1 id="head">probe</h1>
    <div id="map"></div>
    <pre id="out">…</pre>
    <script>
      /* Le volet navigateur n'est pas composité : rAF ne se déclenche jamais et la
         carte ne rend rien. On le remplace par un minuteur — WebGL, lui, dessine. */
      if (new URLSearchParams(location.search).get('raf') !== 'native') {
        window.requestAnimationFrame = (cb) => window.setTimeout(() => cb(performance.now()), 16)
        window.cancelAnimationFrame = (id) => window.clearTimeout(id)
      }
    </script>
    <script type="module" src="/probe.mjs"></script>
  </body>
</html>
